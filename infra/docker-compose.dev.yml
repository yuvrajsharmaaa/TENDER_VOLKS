services:
  postgres:
    image: postgres:15-alpine
    container_name: tender_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tender_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d tender_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tender_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tender_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tender_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    profiles:
      - container-neo4j
    image: neo4j:5.26.0
    container_name: tender_neo4j
    restart: always
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/tenderpassword}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/7687' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tender_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
      - ../ocr:/app/ocr
      - ../gem_parent_tender_extraction_map.yaml:/app/gem_parent_tender_extraction_map.yaml
      - ../artifacts:/app/artifacts
      - ../config:/app/config
    env_file:
      - ../.env.dev
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-uAuYc1U0VzkAhUYlOn7XYWGaWuDRHde3}@postgres:5432/${POSTGRES_DB:-tender_db}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://host.docker.internal:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-volksenergie}
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-volksenergie}
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tender_celery_worker
    restart: always
    volumes:
      - ../backend:/app/backend
      - ../ocr:/app/ocr
      - ../gem_parent_tender_extraction_map.yaml:/app/gem_parent_tender_extraction_map.yaml
      - ../artifacts:/app/artifacts
      - ../config:/app/config
    env_file:
      - ../.env.dev
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-uAuYc1U0VzkAhUYlOn7XYWGaWuDRHde3}@postgres:5432/${POSTGRES_DB:-tender_db}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://host.docker.internal:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-volksenergie}
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-volksenergie}
    command: celery -A backend.app.celery_app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  neo4j_data:
